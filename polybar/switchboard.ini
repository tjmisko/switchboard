; Standalone i3/Polybar bottom bar for Switchboard.
; Install to ~/.config/polybar/switchboard.ini and launch with:
;   polybar -c ~/.config/polybar/switchboard.ini switchboard

[colors]
background = #80282A2E
foreground = #C5C8C6
working = #8ABEB7
idle = #F0C674
permission = #A54242
disabled = #707880

[bar/switchboard]
bottom = true
width = 100%
height = 44pt
radius = 4
dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
border-size = 4pt
border-color = #00000000

padding-top = 5
padding-left = 1.5
padding-right = 1.5
module-margin = 1

font-0 = ${env:POLYBAR_FONT:monospace:size=18;0}
modules-center = switchboard

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3

[module/switchboard]
type = custom/script
exec = ${env:HOME}/go/bin/switchboard-polybar --ctl ${env:HOME}/go/bin/switchboard-ctl --max-sessions 10 --working-color '${colors.working}' --idle-color '${colors.idle}' --permission-color '${colors.permission}' --unknown-color '${colors.disabled}'
tail = true

; Each chip owns its left-click focus action. These bindings cover the whole
; module: right-click opens a picker and the wheel cycles sessions.
click-right = ${env:HOME}/go/bin/switchboard-ctl pick | rofi -dmenu -p Switchboard | awk '{print $1}' | xargs -r ${env:HOME}/go/bin/switchboard-ctl focus
scroll-up = ${env:HOME}/go/bin/switchboard-ctl cycle prev
scroll-down = ${env:HOME}/go/bin/switchboard-ctl cycle next

[settings]
screenchange-reload = true
pseudo-transparency = true
