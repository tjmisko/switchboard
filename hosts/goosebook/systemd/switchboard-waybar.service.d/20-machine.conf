# goosebook: the renderer resolves its control client through `current` too.
#
# The daemon and the control client speak one protocol and must move together;
# cmd/switchboard-ctl/bottombar.go carries a legacy-RPC fallback precisely
# because they can skew. Pointing both units at the same `current` symlink
# means one atomic flip moves the pair, so a skew window only exists between
# the two restarts rather than between two hand-copied files.
[Service]
Environment=SWITCHBOARD_CTL=%h/.local/share/switchboard/current/switchboard-ctl
