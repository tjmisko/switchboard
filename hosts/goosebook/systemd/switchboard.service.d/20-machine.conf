# goosebook: machine-local binary deployment and this host's federation peer.
#
# Both values live in ONE drop-in deliberately. Drop-ins merge in lexical
# order, so splitting the binary path and the argument list across two files
# makes the effective configuration depend on their filenames. Keeping them
# together removes the question entirely.
#
# SWITCHBOARD_BIN points at the `current` symlink, never at a release
# directory. Pinning a release here would defeat the atomic flip: the deploy
# would move `current` while this unit kept launching the old revision, which
# is the same silent no-op the release model exists to eliminate.
#
# SWITCHBOARD_ARGS carries the federation peer. It belongs here rather than in
# systemd/switchboard.service because that file is shared across machines and
# its shipped value is pinned empty by systemd/service_test.go; an in-place
# edit there is reverted by the next unit install without a word.
[Service]
Environment=SWITCHBOARD_BIN=%h/.local/share/switchboard/current/switchboard
Environment="SWITCHBOARD_ARGS=-remote nlessfun"
